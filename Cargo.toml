[package]
name = "hesht"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A CHIP-8 emulator written in Rust"
license = "GPL-3.0-only"
repository = "https://github.com/arhwx/hesht"
keywords = ["chip8", "chip-8", "emulator"]
categories = ["emulators"]

[dependencies]
minifb = "0.29.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
